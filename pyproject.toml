[project]
name = "gala-legal-agent"
version = "0.1.0"
description = "Autonomous AI agent for the legal domain, aligned to a technical glossary via Reinforcement Learning"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.37.0",
    "faiss-cpu",
    "huggingface-hub>=0.23.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.1.0",
    "langchain-community>=0.3.0",
    "langchain-huggingface>=0.1.0",
    "openai>=1.0.0",
    "numpy",
    "python-dotenv",
    "sentence-transformers",
    "transformers",
    "torch",
    "unsloth",
    "agno>=0.4.0",
    "ragas>=0.1.10",
    "datasets>=2.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend", "pages"]
